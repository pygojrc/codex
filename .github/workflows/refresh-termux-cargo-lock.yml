name: Refresh Cargo lock for Termux 0.152.0

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-termux-cargo-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"

      - name: Refresh lockfile from current manifests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo metadata --format-version=1 --no-deps >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo metadata did not update Cargo.lock" >&2
            exit 1
          fi
          git diff --check -- Cargo.lock
          git diff --stat -- Cargo.lock

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git commit -m "build(termux): refresh Cargo lock for vendored OpenSSL"
          git push origin HEAD:main
