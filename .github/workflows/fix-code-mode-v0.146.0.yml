name: Fix Codex 0.146.0 Core merge

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-codex-0.146.0-core-merge
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: >-
      github.repository == 'pygojrc/codex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix-code-mode-01460'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIX_BRANCH: fix-code-mode-01460
      UPSTREAM_BRANCH: upstream-rust-v0.146.0
      UPSTREAM_COMMIT: e363b08c9175ac1cbe5893615dd2cb9ddf95043b
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix-code-mode-01460
          fetch-depth: 0
          persist-credentials: true

      - name: Restore coherent upstream Core integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}"
          test "$(git rev-parse "origin/${UPSTREAM_BRANCH}")" = "${UPSTREAM_COMMIT}"

          paths=(
            codex-rs/code-mode/src/remote_session.rs
            codex-rs/code-mode/src/remote_session/connection.rs
            codex-rs/core/src/guardian/policy_template.md
            codex-rs/core/src/guardian/review.rs
            codex-rs/core/src/guardian/review_session.rs
            codex-rs/core/src/tools/code_mode/mod.rs
            codex-rs/core/src/tools/spec_plan.rs
            codex-rs/core/tests/suite/code_mode.rs
            codex-rs/core/tests/suite/guardian_review.rs
          )
          git checkout "${UPSTREAM_COMMIT}" -- "${paths[@]}"

          rm -f FIX_CODE_MODE_01460.md
          git add "${paths[@]}"
          git add -u FIX_CODE_MODE_01460.md || true

          expected="$(printf '%s\n' FIX_CODE_MODE_01460.md "${paths[@]}" | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "${actual}" = "${expected}"
          git diff --cached --check

      - name: Validate Code Mode, Core and CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cd codex-rs
          rustup run 1.95.0 cargo fmt --all -- --check
          rustup run 1.95.0 cargo check --locked -p codex-code-mode
          rustup run 1.95.0 cargo check --locked -p codex-core
          rustup run 1.95.0 cargo check --locked -p codex-cli

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix(core): restore coherent Codex 0.146.0 integration'
          git push origin "HEAD:${FIX_BRANCH}"
