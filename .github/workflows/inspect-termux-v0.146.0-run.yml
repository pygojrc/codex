name: Inspect Termux 0.146.0 run

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: >-
      github.repository == 'pygojrc/codex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'inspect-termux-01460-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: inspect-termux-01460-run
          persist-credentials: true

      - name: Capture workflow state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/workflows/termux-release-v0.146.0.yml/runs?per_page=20" > .termux-v0.146.0-runs.json

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f INSPECT_TERMUX_01460_RUN.md
          git add .termux-v0.146.0-runs.json
          git add -u INSPECT_TERMUX_01460_RUN.md || true
          git commit -m 'ci: capture Codex 0.146.0 workflow state'
          git push origin HEAD:inspect-termux-01460-run
