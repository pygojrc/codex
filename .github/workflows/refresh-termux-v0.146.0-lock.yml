name: Refresh Termux 0.146.0 Cargo lock

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.repository == 'pygojrc/codex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refresh-termux-01460-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout lock refresh branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refresh-termux-01460-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh workspace lock entries
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cp codex-rs/Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cd codex-rs
          rustup run 1.95.0 cargo update --workspace
          rustup run 1.95.0 cargo metadata --locked --format-version 1 >/dev/null

      - name: Audit workspace-only lock delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import os
          import re
          import tomllib
          from pathlib import Path

          old = tomllib.loads((Path(os.environ['RUNNER_TEMP']) / 'Cargo.lock.before').read_text())
          new = tomllib.loads(Path('codex-rs/Cargo.lock').read_text())

          def key(pkg):
              return (pkg['name'], pkg.get('source'))

          old_pkgs = {key(p): p for p in old['package']}
          new_pkgs = {key(p): p for p in new['package']}
          if old_pkgs.keys() != new_pkgs.keys():
              added = sorted(new_pkgs.keys() - old_pkgs.keys())
              removed = sorted(old_pkgs.keys() - new_pkgs.keys())
              raise SystemExit(f'package set changed; added={added}, removed={removed}')

          local_names = {name for name, source in old_pkgs if source is None}
          suffix = re.compile(r'^(.*) (?:0\.0\.0|0\.144\.6|0\.146\.0)$')

          def normalize_dep(dep):
              match = suffix.match(dep)
              if match and match.group(1) in local_names:
                  return match.group(1)
              return dep

          changes = 0
          allowed_local_dependency_delta = {
              'codex-rmcp-client': ({'webpki-root-certs'}, set()),
          }

          for pkg_key, before in old_pkgs.items():
              after = new_pkgs[pkg_key]
              name, source = pkg_key
              if source is not None:
                  if before != after:
                      raise SystemExit(f'external package changed: {name} {source}')
                  continue

              b = copy.deepcopy(before)
              a = copy.deepcopy(after)
              before_version = b.pop('version')
              after_version = a.pop('version')
              b_deps = {normalize_dep(x) for x in b.pop('dependencies', [])}
              a_deps = {normalize_dep(x) for x in a.pop('dependencies', [])}

              if b != a:
                  raise SystemExit(f'local package metadata changed: {name}')

              added_deps = a_deps - b_deps
              removed_deps = b_deps - a_deps
              allowed_added, allowed_removed = allowed_local_dependency_delta.get(name, (set(), set()))
              if added_deps != allowed_added or removed_deps != allowed_removed:
                  raise SystemExit(
                      f'local dependency structure changed: {name}; '
                      f'added={sorted(added_deps)}, removed={sorted(removed_deps)}'
                  )

              if before_version in {'0.0.0', '0.144.6'}:
                  if after_version != '0.146.0':
                      raise SystemExit(f'local package {name} was not updated to 0.146.0')
                  changes += 1
              elif before_version != after_version:
                  raise SystemExit(f'unexpected local version change: {name}')

          if changes == 0:
              raise SystemExit('no audited workspace version changes')
          print(f'audited {changes} workspace-only lock updates')
          print('audited codex-rmcp-client dependency addition: webpki-root-certs')
          PY
          git diff --check
          git diff --stat -- codex-rs/Cargo.lock

      - name: Commit audited lock file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f REFRESH_TERMUX_01460_LOCK.md
          git add codex-rs/Cargo.lock
          git add -u REFRESH_TERMUX_01460_LOCK.md || true
          git commit -m 'chore(release): refresh Cargo.lock for Codex 0.146.0'
          git push origin HEAD:refresh-termux-01460-lock
