name: Publish rusty_v8 150.4.0 Android artifact

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-rusty-v8-150.4.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful Android build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: "33535017483"
          ARTIFACT_NAME: rusty-v8-android-150.4.0-aarch64-linux-android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" --dir dist
          find dist -maxdepth 2 -type f -print
          (cd dist && sha256sum -c rusty_v8_release_aarch64-linux-android.sha256)

      - name: Publish fork-owned prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: rusty-v8-v150.4.0
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(cat dist/rusty_v8_release_aarch64-linux-android.sha256)"
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "rusty-v8-v150.4.0 Android aarch64-linux-android artifacts" \
            --notes "Android aarch64-linux-android rusty_v8 v150.4.0 artifact pair for Termux-compatible builds.

          Produced by the fork-owned rusty-v8 Android workflow.

          Checksums:
          ${checksum}" \
            --target main \
            --prerelease \
            dist/librusty_v8_release_aarch64-linux-android.a.gz \
            dist/src_binding_release_aarch64-linux-android.rs \
            dist/rusty_v8_release_aarch64-linux-android.sha256
